<style>#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;z-index:999}#overlay.active{display:block}.popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#111827;color:white;padding:20px;border-radius:15px;width:90%;max-width:400px;display:none;z-index:1000}.popup.active{display:block}.payment-option{padding:12px;margin:8px 0;border:1px solid #334155;border-radius:10px;cursor:pointer;background:#0f172a}.payment-option.selected{border:2px solid #3b82f6;background:#1e293b}</style><div id="overlay" onclick="closeDeposit()" style="display:none"></div><div class="popup" id="depositPopup" style="display:none"><h3>💰 Deposit Request</h3><p>Select Payment Method</p><div class="payment-option" onclick="selectPayment(this,'Easypaisa')"><b>Easypaisa</b><br>03XX XXXXXXX</div><div class="payment-option" onclick="selectPayment(this,'JazzCash')"><b>JazzCash</b><br>03XX XXXXXXX</div><div class="payment-option" onclick="selectPayment(this,'UBL')"><b>UBL Bank</b><br>Account + Branch Code</div><div id="accountInput" style="display:none; margin-top:10px;"><input type="text" id="userAccount" placeholder="Enter Sender Account Number" style="width:100%; padding:12px; border-radius:10px; background:#0f172a; color:white; border:1px solid #334155;"></div><input type="number" id="depAmount" placeholder="Enter Amount e.g 3000" min="100" style="width:100%; padding:12px; border-radius:10px; margin-top:10px; background:#0f172a; color:white; border:1px solid #334155;"><p style="font-size:12px;color:#94a3b8">Note: You can deposit from any account</p><button onclick="submitDepositRequest()" style="padding:12px; background:#3b82f6; color:white; border:none; border-radius:10px; margin-top:10px; width:100%">Confirm & Submit</button><button onclick="closeDeposit()" style="padding:12px; background:#334155; color:white; border:none; border-radius:10px; margin-top:8px; width:100%">Cancel</button></div><script>let selectedPayment='';function selectPayment(el,method){document.querySelectorAll('.payment-option').forEach(p=>p.classList.remove('selected'));el.classList.add('selected');selectedPayment=method;document.getElementById('accountInput').style.display='block';if(method=='Easypaisa')document.getElementById('userAccount').placeholder='Enter Sender Easypaisa Number';if(method=='JazzCash')document.getElementById('userAccount').placeholder='Enter Sender JazzCash Number';if(method=='UBL')document.getElementById('userAccount').placeholder='Enter Sender UBL Account';}function submitDepositRequest(){let amt=document.getElementById('depAmount').value;let acc=document.getElementById('userAccount').value;if(!selectedPayment||acc.length<11||amt<100){alert('Please fill all details');return}closeDeposit();alert('Request Submitted for '+amt+' PKR from '+acc)}function closeDeposit(){document.getElementById('overlay').style.display='none';document.getElementById('depositPopup').style.display='none'}function openDeposit(){document.getElementById('overlay').style.display='block';document.getElementById('depositPopup').style.display='block'}</script>
