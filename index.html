<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TPT</title><style>body{background:#111;color:#fff;text-align:center;font-family:Arial}.tpt{margin:30px auto;padding:25px;background:linear-gradient(45deg,#0ff,#00f);border-radius:20px;font-size:24px;font-weight:bold}.btn{display:block;width:90%;margin:15px auto;padding:15px;background:#222;border:1px solid #0ff;border-radius:10px;color:#0ff;font-size:16px}.ov{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;justify-content:center;align-items:center}.box{background:#1f1f1f;padding:20px;border-radius:15px;width:90%;border:2px solid #0ff}input{width:100%;padding:12px;margin:10px 0;background:#222;border:1px solid #0ff;border-radius:8px;color:#fff}</style></head><body><div class="tpt" onclick="showDeposit()">TPT</div><button class="btn" onclick="showDeposit()">Deposit</button><button class="btn" onclick="showTeam()">Team</button><div class="ov" id="depBox"><div class="box"><h2>Deposit</h2><button onclick="h('JazzCash')">JazzCash</button><button onclick="h('Easypaisa')">Easypaisa</button><input id="ua" placeholder="Number"><input id="da" type="number" placeholder="Amount"><button class="btn" onclick="sub()">Submit</button><button class="btn" onclick="cl()">Close</button></div></div><script>function showDeposit(){document.getElementById('depBox').style.display='flex'}function closeDeposit(){document.getElementById('depBox').style.display='none'}function cl(){closeDeposit()}function h(x){document.getElementById('ua').value=x}function sub(){let a=Number(document.getElementById('da').value);if(a<3000){alert("کم از کم 3000 PKR");return}alert("✅ "+a+" PKR + 12% بونس = "+(a*1.12)+" PKR");closeDeposit()}function showTeam(){alert("👥 TPT Commission\nInvite: A=12% B=4% C=1%")}</script></body></html>
