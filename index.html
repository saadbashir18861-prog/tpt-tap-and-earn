<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TPT Tap & Earn</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0f1e;color:#fff;padding-bottom:80px}.header{margin:8px;padding:10px;background:#0a0f1e;border:2px solid #FFD700;border-radius:12px;font-size:26px;font-weight:900;text-align:center;letter-spacing:4px;color:#FFD700;text-shadow:0 0 12px #FFD700, 0 0 20px #FFAA00}.topmenu{display:flex;gap:5px;padding:0 8px;margin-bottom:8px}.topmenu button{flex:1;padding:11px;background:#1e90ff;border:none;border-radius:9px;color:#fff;font-weight:bold;font-size:13px;cursor:pointer}.luckbox{display:flex;align-items:center;gap:8px;margin:8px}.spinbtn{width:60px;height:60px;border-radius:50%;background:conic-gradient(#ff5500,#ffaa00,#ff5500);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;font-size:12px;cursor:pointer;border:2px solid #fff;box-shadow:0 0 10px #ff5500}.spinbtn small{font-size:9px;margin-top:1px;color:#fff}.luckbar{flex:1;padding:16px;background:#1a2238;border-radius:10px;text-align:center;font-weight:bold;font-size:14px;cursor:pointer;color:#fff}.vipbox{margin:8px;padding:12px;background:linear-gradient(45deg,#ff8c00,#ff5500);border-radius:12px;text-align:center}.vipbox h2{font-size:15px;margin-bottom:3px}.vipbox p{font-size:11px;color:#ffe0b2}.fundbox{margin:8px;padding:14px;background:#1a2238;border-radius:10px;display:flex;align-items:center;gap:10px;font-weight:bold;font-size:14px}.depositbox{background:#1a2238;margin:8px;padding:14px;border-radius:12px}.depositbox h3{margin-bottom:7px;font-size:14px;display:flex;align-items:center;gap:8px}.depositbox input{width:100%;padding:10px;margin:6px 0;background:#2a3650;border:none;border-radius:8px;color:#fff;font-size:14px}.depositbox button{width:100%;padding:12px;background:#1e90ff;border:none;border-radius:8px;color:#fff;font-weight:bold;font-size:15px;margin-top:4px;cursor:pointer}.bottomnav{position:fixed;bottom:0;left:0;width:100%;background:#1a2238;display:flex;justify-content:space-around;padding:7px 0;border-top:1px solid #2a3650;z-index:100}.bottomnav div{text-align:center;font-size:10px;color:#888;cursor:pointer}.bottomnav div.active{color:#1e90ff}.bottomnav div span{font-size:19px;display:block;margin-bottom:2px}</style></head><body><div class="header">TPT</div><div class="topmenu"><button onclick="alert('Deposit کھل جائے گا')">Deposit</button><button onclick="alert('Withdraw کھل جائے گا')">Withdraw</button><button onclick="alert('Team کھل جائے گا')">Team</button><button onclick="alert('Fund کھل جائے گا')">Fund</button></div><div class="luckbox"><div class="spinbtn" onclick="alert('Spin کھل جائے گا')">Spin<small>0</small></div><div class="luckbar" onclick="alert('Your Luck کھل جائے گا')">Your Luck</div></div><div class="vipbox"><h2>👑 Become Our VIP</h2><p>Select Your VIP Level - Higher VIP = Higher Daily Income</p></div><div class="fundbox">💎 Fund</div><div class="depositbox"><h3>💰 Deposit Funds</h3><input type="number" placeholder="Enter Amount in PKR"><button>Deposit Now</button></div><div class="bottomnav"><div class="active"><span>🏠</span>Home</div><div onclick="alert('News کھل جائے گا')"><span>📰</span>News</div><div onclick="alert('Task کھل جائے گا')"><span>🎯</span>Task</div><div onclick="alert('Team کھل جائے گا')"><span>👥</span>Team</div><div onclick="alert('Mine کھل جائے گا')"><span>👤</span>Mine</div></div></body></html>
