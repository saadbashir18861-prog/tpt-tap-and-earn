<div class="popup" id="depositPopup">
  <h3>💰 Deposit Request</h3>
  <p>Select Payment Method</p>
  
  <div class="payment-option" onclick="selectPayment(this,'Easypaisa')">
    <b>Easypaisa</b><br>03XX XXXXXXX
  </div>
  <div class="payment-option" onclick="selectPayment(this,'JazzCash')">
    <b>JazzCash</b><br>03XX XXXXXXX
  </div>
  <div class="payment-option" onclick="selectPayment(this,'UBL')">
    <b>UBL Bank</b><br>XXXX-XXXX-XXXX-XXXX
  </div>

  <div id="accountInput" style="display:none">
    <input type="text" id="userAccount" placeholder="Enter Your Easypaisa Account Number" maxlength="11">
  </div>

  <input type="number" id="depAmount" placeholder="Enter Amount e.g 3000" min="100">
  
  <p style="font-size:12px;color:#94a3b8">Step 1: Enter your account number<br>Step 2: Enter amount and Submit</p>
  
  <button onclick="submitDepositRequest()">Confirm & Submit</button>
  <button onclick="closeDeposit()">Cancel</button>
</div>
